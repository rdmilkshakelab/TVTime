<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TVTime</title>
    <style>
        :root {
            --bg: #0c1016;
            --panel: #121a25;
            --panel-alt: #1a2633;
            --line: #2a3948;
            --text: #edf6ff;
            --muted: #a7b7c9;
            --accent: #5ec6ff;
            --accent-2: #71e4b2;
            --warning: #ffbf69;
            --danger: #ff637d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: radial-gradient(circle at top, #182330 0%, var(--bg) 46%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app {
            width: 94vw;
            max-width: 1500px;
            height: 92vh;
            display: grid;
            grid-template-columns: 1.25fr 0.9fr;
            gap: 24px;
        }

        .panel {
            background: rgba(18, 26, 37, 0.96);
            border: 2px solid var(--line);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .main-panel {
            padding: 28px 30px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .eyebrow {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--muted);
            font-weight: 700;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 110px;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(94,198,255,0.12);
            border: 1px solid rgba(94,198,255,0.38);
            color: var(--accent);
            font-weight: 700;
            font-size: 1.05rem;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.3fr 0.8fr;
            gap: 22px;
            align-items: center;
            flex: 1;
        }

        .big-number {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .big-number .value {
            font-size: clamp(5rem, 7vw, 10rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.07em;
        }

        .muted {
            color: var(--muted);
            font-size: 1.5rem;
        }

        .ring-card {
            display: grid;
            place-items: center;
            min-height: 300px;
            padding: 14px;
            background: linear-gradient(145deg, rgba(35, 46, 61, 0.9), rgba(20, 29, 38, 0.9));
            border: 2px solid var(--line);
            border-radius: 26px;
        }

        .ring {
            position: relative;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: conic-gradient(var(--accent) 0 74%, rgba(255,255,255,0.08) 74% 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.35);
        }

        .ring::before {
            content: "";
            position: absolute;
            inset: 18px;
            border-radius: 50%;
            background: rgba(13, 18, 24, 0.96);
            border: 2px solid var(--line);
        }

        .ring-center {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .ring-center strong {
            display: block;
            font-size: 2.8rem;
            line-height: 1;
        }

        .ring-center span {
            display: block;
            margin-top: 6px;
            font-size: 0.9rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--muted);
