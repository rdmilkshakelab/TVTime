name: Build Android TV APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Install Cordova
        run: npm install --global cordova

      - name: Create App Structure
        shell: bash
        run: |
          set -euxo pipefail

          cordova create my_tv_app com.alfernado.tvtime "TVTime"

          cd my_tv_app
          cordova platform add android
          cordova plugin add ../cordova-plugin-tvtime-usage

          rm -rf www/*
          cp ../index.html www/
          cp ../config.xml .

      - name: Compile APK
        shell: bash
        run: |
          set -euxo pipefail

          cd my_tv_app
          cordova build android --debug -- --packageType=apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVTime-APK
          path: my_tv_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
